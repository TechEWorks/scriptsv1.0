name: TechE scripts fixture QA

on:
  push:
    branches: [main]
    paths:
      - '03-beta/src/**'
      - '03-beta/packaging/**'
      - '03-beta/tests/**'
      - '03-beta/ReadMeFirst.txt'
      - 'README.md'
      - 'ReadMeFirst.txt'
      - '.github/workflows/scripts-fixture-qa.yml'
  workflow_dispatch:

jobs:
  pull-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble runtime and exercise native bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in 03-beta/packaging/assemble-runtime.sh 03-beta/src/bootstrap/teche 03-beta/src/bin/teche 03-beta/src/lib/*.sh 03-beta/tests/pull-fixture-test.sh; do
            bash -n "$script"
          done
          runtime=$(mktemp -d)
          bash 03-beta/packaging/assemble-runtime.sh "$runtime"
          (cd "$runtime" && sha256sum -c SHA256SUMS.txt)
          sudo bash 03-beta/tests/pull-fixture-test.sh "$runtime"
